<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Anti-Flash Token</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip" href="#view">İçeriğe geç</a>
  <div id="gate" class="gate">
    <div class="gate-backdrop" aria-hidden="true">
      <span class="gate-grain"></span>
      <span class="gate-vignette"></span>
    </div>
    <section id="gate-stage" class="gate-stage">
      <div class="gate-glow" aria-hidden="true"></div>
      <div class="gate-hero">
        <h2 class="gate-title" aria-label="Tokenlarını Güvende Tut.">
          <span class="gate-line">Tokenlarını</span>
          <span class="gate-line"><em class="gate-accent">Güvende</em> Tut.</span>
        </h2>
        <p class="gate-lede">Blockchain tehditlerine karşı akıllı izleme. Şüpheli tokenları ve riskli işlemleri erkenden fark et.</p>
      </div>
    </section>
    <section class="gate-side">
      <div class="gate-live">
        <p class="gate-live-status">
          <span>Sistem çevrimiçi</span>
          <span aria-hidden="true">·</span>
          <span class="gate-live-mode">İzleme aktif</span>
        </p>
        <div id="gate-live-slot" class="gate-live-slot" aria-hidden="true"></div>
      </div>
      <form id="gate-form" class="gate-card" autocomplete="on">
        <div class="gate-card-top">
          <span class="mark" id="gate-cube" aria-hidden="true"></span>
        </div>
        <h1>Anti-Flash Token</h1>
        <p class="gate-kicker">Local panel</p>
        <label class="field gate-field" for="gate-user">
          <span>Kullanıcı Adı</span>
          <span class="gate-control">
            <svg class="gate-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 8.2a2.3 2.3 0 1 0 0-4.6 2.3 2.3 0 0 0 0 4.6Z"></path><path d="M3.4 13c.6-1.7 2.1-2.6 4.6-2.6s4 .9 4.6 2.6"></path></svg>
            <input id="gate-user" name="username" type="text" autocomplete="username" maxlength="64" placeholder="Kullanıcı adı" required>
          </span>
        </label>
        <label class="field gate-field" for="gate-pass">
          <span>Şifre</span>
          <span class="gate-control">
            <svg class="gate-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.2" y="7" width="9.6" height="6.2" rx="1.2"></rect><path d="M5.4 7V5.2a2.6 2.6 0 0 1 5.2 0V7"></path></svg>
            <input id="gate-pass" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="Şifre" required>
            <button type="button" id="gate-reveal" class="gate-reveal" aria-label="Şifreyi göster" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 8S3.8 4.2 8 4.2 14.4 8 14.4 8 12.2 11.8 8 11.8 1.6 8 1.6 8Z"></path><circle cx="8" cy="8" r="1.6"></circle></svg>
            </button>
          </span>
        </label>
        <p id="gate-caps" class="gate-caps" hidden>Caps Lock açık</p>
        <p id="gate-error" class="gate-error" role="alert"></p>
        <button id="gate-submit" class="gate-submit" type="submit">
          <span class="gate-spinner" aria-hidden="true"></span>
          <span id="gate-submit-label">Giriş</span>
          <svg class="gate-submit-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9.2 4.2 13 8l-3.8 3.8"></path></svg>
        </button>
      </form>
    </section>
    <div id="gate-ticker" class="gate-ticker" hidden>
      <p id="gate-ticker-label" class="gate-ticker-sr"></p>
      <div class="gate-ticker-viewport" aria-hidden="true">
        <div id="gate-ticker-track" class="gate-ticker-track"></div>
      </div>
    </div>
  </div>
  <div class="shell" id="shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Panel">
      <canvas id="sidebar-snow" class="sidebar-snow" aria-hidden="true"></canvas>
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" class="mark-svg">
            <path class="mark-fill" d="M16 2.2 27.2 7.1v9.2c0 7.2-4.7 11.8-11.2 13.9C9.5 28.1 4.8 23.5 4.8 16.3V7.1L16 2.2Z"></path>
            <path class="mark-cut" d="M11.4 16.1 14.3 19l6.4-6.8"></path>
          </svg>
        </span>
        <div>
          <p class="brand-name">Anti-Flash Token</p>
          <p class="brand-kicker">Security intelligence</p>
        </div>
      </div>
      <nav class="nav" aria-label="Sayfalar">
        <div class="nav-group">
        <p class="nav-label">General</p>
        <button type="button" class="nav-item is-active" data-page="overview" aria-current="page">
          <svg viewBox="0 0 16 16" class="icon" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"></rect><rect x="9" y="2" width="5" height="5" rx="1"></rect><rect x="2" y="9" width="5" height="5" rx="1"></rect><rect x="9" y="9" width="5" height="5" rx="1"></rect></svg>
          <span>Overview</span>
        </button>
        <button type="button" class="nav-item" data-page="transfers">
          <svg viewBox="0 0 16 16" class="icon" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h7"></path></svg>
          <span>Transfers</span>
        </button>
        <button type="button" class="nav-item" data-page="risk">
          <svg viewBox="0 0 16 16" class="icon" aria-hidden="true"><path d="M8 1.8 13.2 4v3.6c0 3.2-2.1 5.4-5.2 6.6C4.9 13 2.8 10.8 2.8 7.6V4L8 1.8Z"></path><path d="M8 5.2v3.3"></path><path d="M8 10.6h.01"></path></svg>
          <span>Risk</span>
        </button>
        <button type="button" class="nav-item" data-page="feedback">
          <svg viewBox="0 0 16 16" class="icon" aria-hidden="true"><path d="M3 3.5h10v7.2H6.2L3 13.2V3.5Z"></path></svg>
          <span>Feedback</span>
        </button>
        <button type="button" class="nav-item" data-page="statistics">
          <svg viewBox="0 0 16 16" class="icon" aria-hidden="true"><path d="M3 13V8.5M8 13V3.5M13 13V6"></path></svg>
          <span>Statistics</span>
        </button>
        </div>
        <div class="nav-group">
        <p class="nav-label">Operations</p>
        <button type="button" class="nav-item" data-page="logs">
          <svg viewBox="0 0 16 16" class="icon" aria-hidden="true"><path d="M4 2.5h6l2 2V13.5H4z"></path><path d="M6 7.5h4M6 10h4"></path></svg>
          <span>Logs</span>
        </button>
        <button type="button" class="nav-item" data-page="users">
          <svg viewBox="0 0 16 16" class="icon" aria-hidden="true"><path d="M8 8.2a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8Z"></path><path d="M3.2 13c.7-1.8 2.2-2.7 4.8-2.7s4.1.9 4.8 2.7"></path></svg>
          <span>Users</span>
        </button>
        <button type="button" class="nav-item" data-page="chats">
          <svg viewBox="0 0 16 16" class="icon" aria-hidden="true"><path d="M2.5 3.5h11v7H6L2.5 13V3.5Z"></path></svg>
          <span>Chats</span>
        </button>
        <button type="button" class="nav-item" data-page="settings">
          <svg viewBox="0 0 16 16" class="icon" aria-hidden="true"><path d="M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Z"></path><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"></path></svg>
          <span>Settings</span>
        </button>
        </div>
      </nav>
      <button type="button" id="logout" class="nav-item logout" hidden>Log out</button>
    </aside>
    <button type="button" id="backdrop" class="backdrop" hidden aria-label="Menüyü kapat"></button>
    <div class="workspace">
      <header class="topbar">
        <button type="button" id="menu" class="menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 16 16" class="icon" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"></path></svg>
          <span>Menu</span>
        </button>
        <div class="titles">
          <h1 id="page-title">Overview</h1>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1" aria-live="polite">
        <noscript>Bu panel JavaScript ile çizilir. Tarayıcıda JavaScript açık olmalı.</noscript>
      </main>
    </div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
